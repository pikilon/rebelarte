<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f6f1e7;font-family:Georgia,'Times New Roman',serif;color:#1c1a17;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
    <tr><td style="padding-bottom:16px;font-size:22px;font-weight:bold;letter-spacing:.5px;">Rebelarte<span style="color:#c8321e;">.</span></td></tr>
    <tr><td style="border-top:2px solid #1c1a17;padding-top:20px;">
      <h1 style="margin:0 0 12px;font-size:24px;font-weight:normal;">Bienvenido/a a Rebelarte</h1>
      <p style="margin:0 0 20px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;">Confirma tu correo para terminar de crear tu cuenta. No necesitas contraseña.</p>
      <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c8321e;color:#f6f1e7;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:15px;padding:12px 22px;">Confirmar y entrar</a></p>
      <p style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:14px;">¿Lo abres en otro dispositivo? Introduce este código:</p>
      <p style="margin:0 0 24px;font-size:32px;letter-spacing:8px;font-weight:bold;color:#1c1a17;">{{ .Token }}</p>
      <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#6b655b;line-height:1.5;">Si no has sido tú, ignora este correo. El enlace y el código caducan en una hora.</p>
    </td></tr>
  </table>
</body>
</html>
